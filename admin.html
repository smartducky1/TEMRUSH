<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TEMRUSH ADMIN</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(circle at top, #102315 0%, #061009 45%, #020603 100%);
      color: #fff;
      font-family: "Inter", sans-serif;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1500px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 28px 0;
      border-bottom: 1px solid rgba(145, 255, 0, 0.15);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-family: "Bangers", cursive;
      font-size: 42px;
      letter-spacing: 1px;
    }

    .logo span {
      color: #91ff00;
    }

    .back {
      border: 1px solid rgba(145, 255, 0, 0.35);
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      transition: 0.2s;
    }

    .back:hover {
      background: #91ff00;
      color: #000;
    }

    main {
      padding: 45px 0 80px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 30px;
    }

    h1 {
      font-family: "Bangers", cursive;
      font-size: clamp(48px, 7vw, 82px);
      line-height: 0.9;
    }

    h1 span {
      color: #91ff00;
    }

    .refresh {
      background: #91ff00;
      border: none;
      color: #000;
      padding: 13px 22px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .refresh:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(145, 255, 0, 0.2);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat {
      background: rgba(8, 19, 11, 0.9);
      border: 1px solid rgba(145, 255, 0, 0.2);
      border-radius: 12px;
      padding: 25px;
    }

    .stat-label {
      color: #89958c;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .stat-number {
      font-size: 38px;
      font-weight: 800;
    }

    .table-wrap {
      background: rgba(5, 14, 8, 0.95);
      border: 1px solid rgba(145, 255, 0, 0.2);
      border-radius: 14px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px;
    }

    th {
      background: rgba(145, 255, 0, 0.07);
      color: #91ff00;
      font-size: 12px;
      letter-spacing: 1px;
      text-align: left;
      padding: 17px 16px;
      border-bottom: 1px solid rgba(145, 255, 0, 0.15);
      white-space: nowrap;
    }

    td {
      padding: 17px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(145, 255, 0, 0.025);
    }

    .wallet {
      font-family: monospace;
      font-size: 13px;
    }

    .proof {
      color: #91ff00;
      text-decoration: underline;
      font-weight: 600;
    }

    .proof:hover {
      opacity: 0.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 95px;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .status.pending {
      background: rgba(255, 193, 7, 0.12);
      color: #ffc107;
    }

    .status.approved {
      background: rgba(145, 255, 0, 0.12);
      color: #91ff00;
    }

    .status.rejected {
      background: rgba(255, 70, 70, 0.12);
      color: #ff5555;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action {
      border: none;
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .approve {
      background: #91ff00;
      color: #000;
    }

    .reject {
      background: #ff4545;
      color: #fff;
    }

    .pending-btn {
      background: #ffc107;
      color: #000;
    }

    .action:hover {
      transform: translateY(-1px);
      opacity: 0.85;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #78827b;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #91ff00;
    }

    .error {
      margin-bottom: 20px;
      padding: 15px 18px;
      border: 1px solid rgba(255, 70, 70, 0.35);
      background: rgba(255, 70, 70, 0.08);
      color: #ff6666;
      border-radius: 8px;
      display: none;
    }

    @media (max-width: 700px) {
      .container {
        width: min(100% - 24px, 1500px);
      }

      .logo {
        font-size: 34px;
      }

      .title-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      main {
        padding-top: 30px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">
        TEM<span>RUSH</span>
      </a>

      <a href="index.html" class="back">
        BACK TO SITE
      </a>
    </div>
  </header>

  <main>
    <div class="container">

      <div class="title-row">
        <div>
          <h1>TEM<span>RUSH</span> ADMIN</h1>
        </div>

        <button class="refresh" id="refreshButton">
          REFRESH
        </button>
      </div>

      <div class="error" id="errorMessage"></div>

      <section class="stats">
        <div class="stat">
          <div class="stat-label">TOTAL APPLICATIONS</div>
          <div class="stat-number" id="totalCount">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">PENDING</div>
          <div class="stat-number" id="pendingCount">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">APPROVED</div>
          <div class="stat-number" id="approvedCount">0</div>
        </div>
      </section>

      <section class="table-wrap">

        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>X USERNAME</th>
              <th>WALLET</th>
              <th>QT PROOF</th>
              <th>TAG PROOF</th>
              <th>STATUS</th>
              <th>ACTION</th>
            </tr>
          </thead>

          <tbody id="applicationsBody">
            <tr>
              <td colspan="7" class="loading">
                LOADING APPLICATIONS...
              </td>
            </tr>
          </tbody>
        </table>

      </section>

    </div>
  </main>

  <script>

    /*
      YOUR GOOGLE APPS SCRIPT WEB APP URL
    */
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzPIpFMNi-imzFGVu2csJSxtfziGPPK33pl5HzZddjjA1DGYm1RD67bcGtRBHuP6QY5/exec";


    /*
      IMPORTANT:
      Put the SAME ADMIN_KEY that you already created
      inside Google Apps Script Script Properties.

      This removes the password screen, but the key is
      still sent automatically to the Apps Script.
    */
    const ADMIN_KEY = "PASTE_YOUR_EXISTING_ADMIN_KEY_HERE";


    const body = document.getElementById("applicationsBody");
    const totalCount = document.getElementById("totalCount");
    const pendingCount = document.getElementById("pendingCount");
    const approvedCount = document.getElementById("approvedCount");
    const errorMessage = document.getElementById("errorMessage");
    const refreshButton = document.getElementById("refreshButton");


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function shortWallet(wallet) {
      if (!wallet) return "";

      return wallet.length > 12
        ? `${wallet.slice(0, 6)}...${wallet.slice(-4)}`
        : wallet;
    }


    async function apiRequest(payload) {

      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      return await response.json();
    }


    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = "block";
    }


    function hideError() {
      errorMessage.style.display = "none";
    }


    function statusClass(status) {

      const value = String(status || "").toUpperCase();

      if (value === "APPROVED") {
        return "approved";
      }

      if (value === "REJECTED") {
        return "rejected";
      }

      return "pending";
    }


    function renderApplications(applications) {

      totalCount.textContent = applications.length;

      pendingCount.textContent =
        applications.filter(
          item =>
            String(item.status || "").toUpperCase() === "PENDING"
        ).length;

      approvedCount.textContent =
        applications.filter(
          item =>
            String(item.status || "").toUpperCase() === "APPROVED"
        ).length;


      if (!applications.length) {

        body.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              NO APPLICATIONS FOUND.
            </td>
          </tr>
        `;

        return;
      }


      body.innerHTML = applications.map((item, index) => {

        const status =
          String(item.status || "PENDING").toUpperCase();

        const statusCls = statusClass(status);


        return `
          <tr>

            <td>
              ${index + 1}
            </td>

            <td>
              ${escapeHtml(item.xUsername || "")}
            </td>

            <td class="wallet">
              ${escapeHtml(shortWallet(item.wallet || ""))}
            </td>

            <td>
              ${
                item.quoteProof
                  ? `
                    <a
                      class="proof"
                      href="${escapeHtml(item.quoteProof)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      OPEN
                    </a>
                  `
                  : "-"
              }
            </td>

            <td>
              ${
                item.tagFriendsProof
                  ? `
                    <a
                      class="proof"
                      href="${escapeHtml(item.tagFriendsProof)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      OPEN
                    </a>
                  `
                  : "-"
              }
            </td>

            <td>
              <span class="status ${statusCls}">
                ${escapeHtml(status)}
              </span>
            </td>

            <td>
              <div class="actions">

                <button
                  class="action approve"
                  onclick="updateStatus(${item.row}, 'APPROVED')"
                >
                  APPROVE
                </button>

                <button
                  class="action reject"
                  onclick="updateStatus(${item.row}, 'REJECTED')"
                >
                  REJECT
                </button>

                <button
                  class="action pending-btn"
                  onclick="updateStatus(${item.row}, 'PENDING')"
                >
                  PENDING
                </button>

              </div>
            </td>

          </tr>
        `;

      }).join("");
    }


    async function loadApplications() {

      hideError();

      body.innerHTML = `
        <tr>
          <td colspan="7" class="loading">
            LOADING APPLICATIONS...
          </td>
        </tr>
      `;

      try {

        const result = await apiRequest({
          action: "admin_list",
          adminKey: ADMIN_KEY
        });


        if (!result.ok) {

          showError(
            result.error || "Unable to load applications."
          );

          body.innerHTML = `
            <tr>
              <td colspan="7" class="empty">
                FAILED TO LOAD APPLICATIONS.
              </td>
            </tr>
          `;

          return;
        }


        renderApplications(
          Array.isArray(result.applications)
            ? result.applications
            : []
        );

      } catch (error) {

        console.error(error);

        showError(
          "Could not connect to the submission service."
        );

        body.innerHTML = `
          <tr>
            <td colspan="7" class="empty">
              CONNECTION ERROR.
            </td>
          </tr>
        `;
      }
    }


    async function updateStatus(row, status) {

      const confirmed = confirm(
        `Change this application to ${status}?`
      );

      if (!confirmed) {
        return;
      }


      try {

        const result = await apiRequest({
          action: "admin_update",
          adminKey: ADMIN_KEY,
          row: row,
          status: status
        });


        if (!result.ok) {

          alert(
            result.error || "Unable to update application."
          );

          return;
        }


        await loadApplications();

      } catch (error) {

        console.error(error);

        alert(
          "Could not connect to the submission service."
        );
      }
    }


    refreshButton.addEventListener(
      "click",
      loadApplications
    );


    /*
      LOAD AUTOMATICALLY WHEN /admin.html OPENS
    */
    loadApplications();

  </script>

</body>
</html>
